[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "legacy", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"ml/tests/*" = ["B011"]
"backend/app/api/**" = ["B008"]  # Depends()/File() in defaults is idiomatic FastAPI

[tool.pytest.ini_options]
testpaths = ["ml/tests"]
addopts = "-q"
